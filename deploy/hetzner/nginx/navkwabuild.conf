server {
    listen 80;
    listen [::]:80;
    server_name app.navkwa.com;

    root /var/www/navkwa-build/current/frontend/dist;
    index index.html;

    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Accel-Buffering "no" always;

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.svg =404;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ^~ /api/ {
        try_files $uri @navkwabuild_laravel;
    }

    location = /up {
        try_files $uri @navkwabuild_laravel;
    }

    location ^~ /storage/ {
        return 404;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.php {
        return 404;
    }

    location @navkwabuild_laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/navkwa-build/current/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/navkwa-build/current/backend/public;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
