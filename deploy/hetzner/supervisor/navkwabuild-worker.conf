[program:navkwabuild-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/navkwa-build/current/backend/artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/navkwa-build/shared/logs/worker.log
stopwaitsecs=3600
